name: Train GNN Model

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model type (gcn or gin)'
        required: false
        default: 'gin'
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '15'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU
        run: pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install torch-geometric==2.5.3
          pip install "numpy<2" ogb rdkit scikit-learn pandas pyyaml tqdm

      - name: Set model + epochs
        id: params
        run: |
          echo "model=${{ github.event.inputs.model || 'gin' }}" >> $GITHUB_OUTPUT
          echo "epochs=${{ github.event.inputs.epochs || '15' }}" >> $GITHUB_OUTPUT

      - name: Train model
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.train \
            --model ${{ steps.params.outputs.model }} \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --patience 5 \
            --outdir outputs/run_${{ steps.params.outputs.model }}

      - name: Save dataset stats + preprocessing summary
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from src.data.load_ogb import build_dataloaders, save_dataset_stats
          dataset, split_idx, *_ = build_dataloaders()
          save_dataset_stats(dataset, split_idx, 'outputs/run_${{ steps.params.outputs.model }}')
          print('Dataset stats saved')
          "
          python -m src.run_pipeline \
            --outdir outputs/run_${{ steps.params.outputs.model }}

      - name: Show results
        run: |
          echo "=== Run Summary ==="
          cat outputs/run_${{ steps.params.outputs.model }}/run_summary.json
          echo ""
          echo "=== Last 5 epochs ==="
          python -c "
          import pandas as pd
          df = pd.read_csv('outputs/run_${{ steps.params.outputs.model }}/metrics.csv')
          print(df.tail(5).to_string(index=False))
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnn-model-${{ steps.params.outputs.model }}
          path: outputs/run_${{ steps.params.outputs.model }}/
          retention-days: 90

      - name: Publish to GitHub Release
        run: |
          MODEL=${{ steps.params.outputs.model }}
          OUTDIR="outputs/run_${MODEL}"
          TAG="model-latest"

          # Delete old release + tag if exists
          gh release delete $TAG --yes 2>/dev/null || true
          git push origin --delete $TAG 2>/dev/null || true

          # Create new release with all artifacts
          gh release create $TAG \
            --title "Latest Trained Model ($(date -u +%Y-%m-%d))" \
            --notes "Model: ${MODEL} | Epochs: ${{ steps.params.outputs.epochs }} | SHA: ${{ github.sha }}" \
            ${OUTDIR}/best_model.pt \
            ${OUTDIR}/metrics.csv \
            ${OUTDIR}/run_summary.json \
            ${OUTDIR}/dataset_stats.json \
            ${OUTDIR}/preprocessing_summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
