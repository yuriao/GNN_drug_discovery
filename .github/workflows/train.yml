name: Train GNN Ensemble (5-Fold GIN + Morgan RF)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Epochs per fold'
        required: false
        default: '30'
      k_folds:
        description: 'Number of CV folds'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU
        run: pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install torch-geometric==2.5.3
          pip install "numpy<2" ogb rdkit scikit-learn joblib pandas pyyaml tqdm

      - name: Set params
        id: params
        run: |
          echo "epochs=${{ github.event.inputs.epochs || '30' }}" >> $GITHUB_OUTPUT
          echo "k_folds=${{ github.event.inputs.k_folds || '5' }}" >> $GITHUB_OUTPUT

      # ── Train GIN with K-Fold Cross-Validation ────────────────────────────
      # Trains K independent GIN models on complementary splits of train+val.
      # At inference, all K models' predictions are averaged.
      # K-Fold uses more data than single-model training and reduces variance.
      - name: Train GIN (K-Fold CV)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.train_kfold \
            --model gin_enhanced \
            --k-folds ${{ steps.params.outputs.k_folds }} \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --patience 10 \
            --pos-weight 0 \
            --outdir outputs/run_gin_kfold

      # ── Train Morgan FP + Random Forest ──────────────────────────────────
      # Completely different feature space from GNN → complementary errors.
      # Morgan fingerprints capture global circular substructures;
      # GNN captures local graph topology. Together they see the molecule differently.
      - name: Train Morgan RF
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.train_rf \
            --n-estimators 500 \
            --seed 42 \
            --outdir outputs/run_rf

      # ── Dataset stats ─────────────────────────────────────────────────────
      - name: Save dataset stats
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p outputs/run_gin
          python -c "
          from src.data.load_ogb import build_dataloaders, save_dataset_stats
          dataset, split_idx, *_ = build_dataloaders()
          save_dataset_stats(dataset, split_idx, 'outputs/run_gin')
          print('Dataset stats saved')
          "
          python -m src.run_pipeline --outdir outputs/run_gin

      # ── Evaluate full ensemble ────────────────────────────────────────────
      - name: Evaluate ensemble
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.evaluate_ensemble \
            --kfold-dir outputs/run_gin_kfold \
            --rf-path outputs/run_rf/best_model.joblib \
            --outfile outputs/ensemble_summary.json
          echo "=== Ensemble Summary ==="
          cat outputs/ensemble_summary.json

      # ── Show results ──────────────────────────────────────────────────────
      - name: Show results
        run: |
          echo "=== K-Fold GIN Summary ==="
          cat outputs/run_gin_kfold/kfold_summary.json 2>/dev/null || echo "(not found)"
          echo "=== Morgan RF Summary ==="
          cat outputs/run_rf/run_summary.json 2>/dev/null || echo "(not found)"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnn-kfold-models
          path: |
            outputs/run_gin_kfold/
            outputs/run_gin/
            outputs/run_rf/
            outputs/ensemble_summary.json
          retention-days: 90

      # ── Publish to GitHub Release ─────────────────────────────────────────
      - name: Publish to GitHub Release
        run: |
          TAG="model-latest"
          gh release delete $TAG --yes 2>/dev/null || true
          git push origin --delete $TAG 2>/dev/null || true

          mkdir -p dist

          # K-Fold GIN checkpoints
          cp outputs/run_gin_kfold/kfold_summary.json dist/kfold_summary.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            f="outputs/run_gin_kfold/fold_${i}/best_model.pt"
            [ -f "$f" ] && cp "$f" "dist/gin_kfold_fold${i}.pt" || true
          done

          # RF checkpoint
          cp outputs/run_rf/best_model.joblib  dist/rf_best_model.joblib 2>/dev/null || true
          cp outputs/run_rf/run_summary.json   dist/rf_run_summary.json  2>/dev/null || true

          # Shared artifacts
          cp outputs/run_gin/dataset_stats.json         dist/dataset_stats.json
          cp outputs/run_gin/preprocessing_summary.json dist/preprocessing_summary.json
          cp outputs/ensemble_summary.json              dist/ensemble_summary.json

          # Build asset list dynamically
          ASSETS=""
          for f in dist/gin_kfold_fold*.pt dist/rf_best_model.joblib dist/rf_run_summary.json \
                    dist/kfold_summary.json dist/dataset_stats.json \
                    dist/preprocessing_summary.json dist/ensemble_summary.json; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done

          gh release create $TAG \
            --title "Latest Model: 5-Fold GIN + Morgan RF ($(date -u +%Y-%m-%d))" \
            --notes "Strategy: 5-Fold Enhanced GIN (VNode+JK+RDKit) + Morgan RF | Epochs: ${{ steps.params.outputs.epochs }} | K: ${{ steps.params.outputs.k_folds }} | SHA: ${{ github.sha }}" \
            $ASSETS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
