name: Train GNN Ensemble (GIN + GCN + GINE)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Epochs per model'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU
        run: pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install torch-geometric==2.5.3
          pip install "numpy<2" ogb rdkit scikit-learn pandas pyyaml tqdm

      - name: Set epochs
        id: params
        run: echo "epochs=${{ github.event.inputs.epochs || '50' }}" >> $GITHUB_OUTPUT

      # ── Train GIN with 5-Fold Cross-Validation ──────────────────────────────
      # K-Fold trains K GIN models on complementary data splits → averaged predictions
      # reduce variance and consistently improve AUC vs single-model training.
      - name: Train GIN (5-Fold CV)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install scikit-learn
          python -m src.train_kfold \
            --model gin \
            --k-folds 5 \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --patience 10 \
            --pos-weight 0 \
            --outdir outputs/run_gin_kfold
          # Single GIN for backward compatibility
          python -m src.train \
            --model gin \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --patience 10 \
            --pos-weight 0 \
            --augment-positives 10 \
            --outdir outputs/run_gin

      # ── Train GCN ─────────────────────────────────────────────────────────
      # Reverted to lr=1e-3 hidden=128 (lower lr caused epoch-1 convergence failure).
      # Patience=15 gives more time; augment-positives helps the imbalanced data.
      - name: Train GCN
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.train \
            --model gcn \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --weight-decay 1e-5 \
            --patience 15 \
            --pos-weight 0 \
            --augment-positives 5 \
            --outdir outputs/run_gcn

      # ── Train GINE (edge features + augment positives) ─────────────────────
      - name: Train GINE
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.train \
            --model gine \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 64 \
            --hidden-dim 128 \
            --num-layers 4 \
            --dropout 0.2 \
            --lr 1e-3 \
            --patience 12 \
            --pos-weight 0 \
            --augment-positives 5 \
            --outdir outputs/run_gine

      # ── Train Morgan FP + Random Forest (4th ensemble member) ─────────────
      - name: Train Morgan RF
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install scikit-learn joblib
          python -m src.train_rf \
            --n-estimators 500 \
            --seed 42 \
            --outdir outputs/run_rf

      # ── Dataset stats ──────────────────────────────────────────────────────
      - name: Save dataset stats
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from src.data.load_ogb import build_dataloaders, save_dataset_stats
          dataset, split_idx, *_ = build_dataloaders()
          for d in ['outputs/run_gin', 'outputs/run_gcn', 'outputs/run_gine']:
              save_dataset_stats(dataset, split_idx, d)
          print('Dataset stats saved')
          "
          python -m src.run_pipeline --outdir outputs/run_gin

      # ── Evaluate full ensemble: GIN+GCN+GINE+RF ─────────────────────────────
      - name: Evaluate ensemble
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.evaluate_ensemble \
            --gnn-dirs outputs/run_gin outputs/run_gcn outputs/run_gine \
            --kfold-dir outputs/run_gin_kfold \
            --rf-path outputs/run_rf/best_model.joblib \
            --outfile outputs/ensemble_summary.json
          echo "=== Ensemble Summary ==="
          cat outputs/ensemble_summary.json

      # ── Show individual results ────────────────────────────────────────────
      - name: Show results
        run: |
          for model in gin gcn gine rf; do
            echo "=== $model ==="
            cat outputs/run_${model}/run_summary.json 2>/dev/null || echo "(not found)"
          done

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnn-ensemble-models
          path: |
            outputs/run_gin/
            outputs/run_gin_kfold/
            outputs/run_gcn/
            outputs/run_gine/
            outputs/run_rf/
            outputs/ensemble_summary.json
          retention-days: 90

      # ── Publish to GitHub Release ──────────────────────────────────────────
      - name: Publish to GitHub Release
        run: |
          TAG="model-latest"
          gh release delete $TAG --yes 2>/dev/null || true
          git push origin --delete $TAG 2>/dev/null || true

          mkdir -p dist
          cp outputs/run_gin/best_model.pt       dist/gin_best_model.pt
          cp outputs/run_gcn/best_model.pt       dist/gcn_best_model.pt
          cp outputs/run_gine/best_model.pt      dist/gine_best_model.pt
          cp outputs/run_rf/best_model.joblib    dist/rf_best_model.joblib
          cp outputs/run_gin/metrics.csv    dist/gin_metrics.csv
          cp outputs/run_gcn/metrics.csv    dist/gcn_metrics.csv
          cp outputs/run_gine/metrics.csv   dist/gine_metrics.csv
          cp outputs/run_gin/run_summary.json   dist/gin_run_summary.json
          cp outputs/run_gcn/run_summary.json   dist/gcn_run_summary.json
          cp outputs/run_gine/run_summary.json  dist/gine_run_summary.json
          cp outputs/run_rf/run_summary.json    dist/rf_run_summary.json
          if [ -d outputs/run_gin_kfold ]; then
            cp outputs/run_gin_kfold/kfold_summary.json dist/kfold_summary.json 2>/dev/null || true
            for i in 1 2 3 4 5; do
              f=outputs/run_gin_kfold/fold_${i}/best_model.pt
              [ -f "$f" ] && cp "$f" dist/gin_kfold_fold${i}.pt || true
            done
          fi
          cp outputs/run_gin/dataset_stats.json         dist/dataset_stats.json
          cp outputs/run_gin/preprocessing_summary.json dist/preprocessing_summary.json
          cp outputs/ensemble_summary.json              dist/ensemble_summary.json

          gh release create $TAG \
            --title "Latest Ensemble Model ($(date -u +%Y-%m-%d))" \
            --notes "Full ensemble: GIN+GCN+GINE+MorganRF | val-AUC softmax weights | Epochs: ${{ steps.params.outputs.epochs }} | SHA: ${{ github.sha }}" \
            dist/gin_best_model.pt \
            dist/gcn_best_model.pt \
            dist/gine_best_model.pt \
            dist/gin_metrics.csv \
            dist/gcn_metrics.csv \
            dist/gine_metrics.csv \
            dist/gin_run_summary.json \
            dist/gcn_run_summary.json \
            dist/gine_run_summary.json \
            dist/rf_best_model.joblib \
            dist/rf_run_summary.json \
            $(ls dist/gin_kfold_fold*.pt 2>/dev/null | tr '\n' ' ') \
            $(ls dist/kfold_summary.json 2>/dev/null || true) \
            dist/dataset_stats.json \
            dist/preprocessing_summary.json \
            dist/ensemble_summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
